[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "junction-pilot"
version = "0.1.0"
description = "Heading-aware path decisions for competition-inspired line-following cars"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
junctionpilot = "junctionpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
